<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Analysis Form</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="padding: 2rem;">
        <h1>Test du formulaire d'analyse</h1>
        
        <button onclick="testStartAnalysis('swot')" class="btn btn-primary">
            <i class="fas fa-plus"></i> Tester Analyse SWOT
        </button>
        <button onclick="testStartAnalysis('porter')" class="btn btn-primary">
            <i class="fas fa-plus"></i> Tester Porter 5 Forces
        </button>
        <button onclick="testStartAnalysis('pestel')" class="btn btn-primary">
            <i class="fas fa-plus"></i> Tester PESTEL
        </button>
        <button onclick="testStartAnalysis('competitive')" class="btn btn-primary">
            <i class="fas fa-plus"></i> Tester Concurrentiel
        </button>
        
        <button onclick="testCollectData('swot')" class="btn btn-secondary" style="margin-top: 1rem;">
            Tester collectAnalysisData SWOT
        </button>
        <button onclick="testCollectData('porter')" class="btn btn-secondary">
            Tester collectAnalysisData Porter
        </button>
        
        <div id="testResults" style="margin-top: 2rem; padding: 1rem; background: #f5f5f5; border-radius: 8px;"></div>
    </div>
    
    <!-- Modal d'analyse -->
    <div class="modal" id="analysisModal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h3 id="analysisModalTitle">Lancer une analyse</h3>
                <button class="modal-close" id="analysisModalClose" onclick="document.getElementById('analysisModal').classList.remove('visible')">&times;</button>
            </div>
            <div class="modal-body" id="analysisModalBody">
                <form id="analysisForm" class="analysis-form">
                    <div class="form-group">
                        <label class="form-label" for="analysisType">Type d'analyse</label>
                        <select class="form-select" id="analysisType" required>
                            <option value="">Sélectionnez un type</option>
                            <option value="swot">Analyse SWOT (5 tokens)</option>
                            <option value="porter">Porter 5 Forces (20 tokens)</option>
                            <option value="pestel">Analyse PESTEL (15 tokens)</option>
                            <option value="competitive">Analyse Concurrentielle (20 tokens)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="analysisName">Nom de l'analyse</label>
                        <input type="text" class="form-input" id="analysisName" placeholder="Ex: Analyse SWOT - Entreprise X" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="analysisDescription">Description (optionnel)</label>
                        <textarea class="form-textarea" id="analysisDescription" placeholder="Décrivez ce que vous souhaitez analyser..."></textarea>
                    </div>
                    
                    <!-- Conteneur pour les champs spécifiques selon le type d'analyse -->
                    <div class="form-group" id="analysisSpecificFields"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="analysisModalCancel" onclick="document.getElementById('analysisModal').classList.remove('visible')">Annuler</button>
                <button type="button" class="btn btn-primary" onclick="testCollectAndShow()">
                    <i class="fas fa-play"></i> Tester Collecte de Données
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Copier les fonctions depuis dashboard.js
        function updateSpecificFields(type, container) {
            if (!container) return;
            
            container.innerHTML = '';
            
            const section = document.createElement('div');
            section.className = 'analysis-specific-section';
            
            let html = '<h4>Données spécifiques pour l\'analyse</h4>';
            
            switch (type) {
                case 'swot':
                    html += `
                        <div class="specific-fields-grid">
                            <div class="form-group">
                                <label class="form-label">Nom de l'entreprise</label>
                                <input type="text" class="form-input" id="companyName" placeholder="Nom de votre entreprise">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Secteur d'activité</label>
                                <input type="text" class="form-input" id="companyIndustry" placeholder="Ex: Technologie, Retail, etc.">
                            </div>
                        </div>
                        <p class="form-hint"><i class="fas fa-info-circle"></i> Plus vous fournissez d'informations, plus l'analyse sera précise.</p>
                    `;
                    break;
                    
                case 'porter':
                    html += `
                        <div class="specific-fields-grid">
                            <div class="form-group">
                                <label class="form-label">Nom de l'entreprise</label>
                                <input type="text" class="form-input" id="companyName" placeholder="Nom de votre entreprise">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stratégie principale</label>
                                <select class="form-select" id="companyStrategy">
                                    <option value="">Sélectionnez...</option>
                                    <option value="differentiation">Différenciation</option>
                                    <option value="cost_leadership">Leadership par les coûts</option>
                                </select>
                            </div>
                        </div>
                        <p class="form-hint"><i class="fas fa-info-circle"></i> Décrivez votre position concurrentielle.</p>
                    `;
                    break;
                    
                default:
                    html += '<p>Sélectionnez un type d\'analyse pour voir les champs spécifiques.</p>';
            }
            
            section.innerHTML = html;
            container.appendChild(section);
        }
        
        function testStartAnalysis(type) {
            const modal = document.getElementById('analysisModal');
            const modalTitle = document.getElementById('analysisModalTitle');
            const analysisTypeInput = document.getElementById('analysisType');
            const specificFieldsContainer = document.getElementById('analysisSpecificFields');
            
            if (modal) {
                analysisTypeInput.value = type;
                
                const analysisNames = {
                    swot: 'Analyse SWOT',
                    porter: 'Porter 5 Forces',
                    pestel: 'Analyse PESTEL',
                    competitive: 'Analyse Concurrentielle'
                };
                
                if (modalTitle && analysisNames[type]) {
                    modalTitle.textContent = `Lancer : ${analysisNames[type]}`;
                }
                
                updateSpecificFields(type, specificFieldsContainer);
                modal.classList.add('visible');
            }
        }
        
        function testCollectAndShow() {
            const type = document.getElementById('analysisType').value;
            const results = collectAnalysisData(type);
            document.getElementById('testResults').innerHTML = `
                <pre>${JSON.stringify(results, null, 2)}</pre>
            `;
        }
        
        function collectAnalysisData(type) {
            const companyData = {
                name: document.getElementById('companyName')?.value || 'Mon Entreprise',
                industry: document.getElementById('companyIndustry')?.value || 'Non spécifié'
            };
            
            // Mock default data
            const defaultData = {
                name: 'Entreprise Exemple',
                industry: 'Technologie',
                revenue: 50000000,
                employees: 250,
                marketShare: 0.15,
                strategy: 'differentiation',
                quality: 8,
                price: 1.0
            };
            
            switch (type) {
                case 'swot':
                    if (document.getElementById('companyIndustry')?.value) {
                        companyData.industry = document.getElementById('companyIndustry').value;
                    }
                    break;
                    
                case 'porter':
                    if (document.getElementById('companyStrategy')?.value) {
                        companyData.strategy = document.getElementById('companyStrategy').value;
                    }
                    break;
                    
                default:
                    return defaultData;
            }
            
            return { ...defaultData, ...companyData };
        }
        
        // Initialiser le changement de type
        document.getElementById('analysisType').addEventListener('change', function() {
            const container = document.getElementById('analysisSpecificFields');
            updateSpecificFields(this.value, container);
        });
    </script>
</body>
</html>
