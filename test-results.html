<!DOCTYPE html>
<html>
<head>
    <title>Test Results</title>
</head>
<body>
    <h1>Test d'ouverture des résultats</h1>
    <button onclick="testResults()">Tester l'ouverture des résultats</button>
    
    <script>
        function testResults() {
            const testData = {
                type: 'swot',
                name: 'Test Analyse SWOT',
                description: 'Ceci est un test',
                cost: 5,
                score: 85,
                createdAt: new Date().toISOString(),
                results: {
                    strengths: ['Force 1', 'Force 2', 'Force 3'],
                    weaknesses: ['Faiblesse 1', 'Faiblesse 2'],
                    opportunities: ['Opportunité 1', 'Opportunité 2'],
                    threats: ['Menace 1'],
                    strategicInsights: 'Insights stratégiques...',
                    recommendations: ['Recommandation 1', 'Recommandation 2'],
                    summary: 'Résumé de l\'analyse SWOT'
                }
            };
            
            try {
                localStorage.setItem('dpai_analysis_results', JSON.stringify(testData));
                window.open('analysis-results.html', '_blank');
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur: ' + error.message);
            }
        }
    </script>
</body>
</html>
